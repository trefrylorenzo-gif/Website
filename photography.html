<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorenzo Trefry | Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>body { visibility: hidden; }</style>
<noscript><style>body { visibility: visible; }</style></noscript>
</head>
<body>

  <!-- Hero -->
  <header class="title-section">
    <img class="title-bg" src="hero-bg.jpg" alt="">
    <div class="title-header">
      <h1 class="title">Lorenzo Trefry</h1>
      <p class="subtitle">Creative for Hire</p>
    </div>
  </header>

  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="hand-modeling.html">Hand Modeling</a>
    <a href="photography.html" class="active">Photography</a>
    <a href="videography.html">Videography</a>
    <a href="writing.html">Writing</a>
    <a href="values.html">Values</a>
    <a href="qa.html">Q&amp;A</a>
  </nav>

  <script>
    (function () {
      function scrollAndReveal() {
        window.scrollTo(0, document.querySelector('.site-nav').offsetTop);
        document.body.style.visibility = 'visible';
      }
      var settled = Promise.all([
        new Promise(function (resolve) { window.addEventListener('load', resolve); }),
        document.fonts ? document.fonts.ready : Promise.resolve(),
      ]);
      var done = false;
      function once() {
        if (done) return;
        done = true;
        scrollAndReveal();
      }
      settled.then(once);
      setTimeout(once, 1500);
    })();
  </script>


  <main>
    <section class="single-column">
      <div class="content-container text-center">
        <h2 class="page-title">Photography</h2>
      </div>
    </section>

    <section class="single-column">
      <div class="content-container text-center">
        <h2>Whittier Aerials</h2>
      </div>
    </section>

    <section class="photo-grid-section">
      <div class="content-container wide">
        <figure class="photo-grid">
          <div class="photo-group photo-group-small">
            <div class="photo-tile"><img src="whittier-1.jpg" alt=""></div>
            <div class="photo-tile"><img src="whittier-2.jpg" alt=""></div>
          </div>
          <div class="photo-group photo-group-small">
            <div class="photo-tile"><img src="whittier-3.jpg" alt=""></div>
            <div class="photo-tile"><img src="whittier-4.jpg" alt=""></div>
          </div>
          <figcaption>Drone photos shot for LA based Whittier Aerials</figcaption>
        </figure>
      </div>
    </section>

    <section class="single-column">
      <div class="content-container text-center">
        <h2>Those That Cry in the Dark</h2>
      </div>
    </section>

    <section class="photo-grid-section">
      <div class="content-container">
        <figure class="photo-grid">
          <div class="photo-group">
            <div class="photo-tile"><img src="brendan-li-1.jpg" alt=""></div>
            <div class="photo-tile"><img src="brendan-li-2.jpg" alt=""></div>
          </div>
          <figcaption>Photoshoot for horror author Brendan Li's book launch for the novel &quot;Those That Cry in The Dark&quot;</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Lorenzo Trefry</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
