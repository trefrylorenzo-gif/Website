<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="hand-modeling.html" class="active">Hand Modeling</a>
    <a href="photography.html">Photography</a>
    <a href="writing.html">Writing</a>
    <a href="values.html">Values</a>
    <a href="qa.html">Q&amp;A</a>
  </nav>

  <main>
    <!-- On Wrist Modeling -->
    <section class="single-column">
      <div class="content-container text-center">
        <h2>On Wrist Modeling</h2>
      </div>
    </section>

    <section class="photo-grid-section">
      <div class="content-container">
        <figure class="photo-grid">
          <div class="photo-group photo-group-mobile-stack">
            <div class="photo-tile"><img src="wrist-1.jpg" alt=""></div>
            <div class="photo-tile"><img src="wrist-2.jpg" alt=""></div>
          </div>
          <div class="photo-group photo-group-mobile-stack">
            <div class="photo-tile"><img src="wrist-3.jpg" alt=""></div>
            <div class="photo-tile"><img src="wrist-4.jpg" alt=""></div>
          </div>
          <figcaption>Client: AURA Watches</figcaption>
        </figure>
      </div>
    </section>

    <!-- Food Modeling -->
    <section class="split-section image-on-left compact">
      <div class="split-image two-up">
        <img src="food-bg.jpg" alt="Food modeling">
        <img src="food-full.jpg" alt="Pancake stack">
      </div>
      <div class="content-container">
        <h2>FOOD Modeling</h2>
        <p>Client: Small Green Door</p>
      </div>
    </section>

    <!-- Product Modeling -->
    <section class="split-section image-on-right compact">
      <div class="split-image two-up">
        <img src="product-bg.jpg" alt="Product modeling">
        <img src="product-full.jpg" alt="Product shot">
      </div>
      <div class="content-container">
        <h2>Product Modeling</h2>
        <p>Client: Joaquin Vega</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Lorenzo Trefry</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
